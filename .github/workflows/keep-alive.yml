name: Keep Supabase alive

on:
  schedule:
    - cron: '0 8 * * *'  # every day at 8am UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat row
        run: |
          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"pinged_at":"now()"}')
          echo "Status: $STATUS"
          cat /tmp/body.txt
          if [ "$STATUS" != "201" ]; then exit 1; fi

      - name: Delete old heartbeat rows
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/heartbeat?id=gt.0" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
